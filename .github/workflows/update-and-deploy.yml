# Refreshes conflict events and carrier positions daily with Claude + web search,
# commits any changes, and deploys the site to GitHub Pages.
#
# Setup (once):
#   1. Settings → Secrets and variables → Actions → New repository secret:
#      ANTHROPIC_API_KEY = your Anthropic API key.
#   2. Settings → Pages → Build and deployment → Source: "GitHub Actions".
# Optional repository variables: FF_MODEL (default claude-opus-5-5), FF_EFFORT (default medium).

name: Update data and deploy site

on:
  schedule:
    - cron: "23 10 * * *" # daily at 10:23 UTC
  workflow_dispatch: # "Run workflow" button in the Actions tab
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-and-deploy
  cancel-in-progress: false

jobs:
  update:
    # Pushes only redeploy; the data refresh runs on the schedule or on demand.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      FF_MODEL: ${{ vars.FF_MODEL }}
      FF_EFFORT: ${{ vars.FF_EFFORT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scripts/update-data/package-lock.json

      - name: Install updater dependencies
        working-directory: scripts/update-data
        run: npm ci

      - name: Warn if the API key is missing
        if: env.ANTHROPIC_API_KEY == ''
        run: echo "::warning::ANTHROPIC_API_KEY secret is not set, so the data was not refreshed."

      - name: Refresh events and carrier positions
        if: env.ANTHROPIC_API_KEY != ''
        working-directory: scripts/update-data
        run: node update.mjs

      - name: Commit updated data
        run: |
          if git diff --quiet -- data/; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Update conflict events and carrier positions ($(date -u +%F))"
          git push

  deploy:
    needs: update
    # Deploy after a successful refresh, or on a plain push (when the update job is skipped).
    if: ${{ !cancelled() && (needs.update.result == 'success' || needs.update.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
